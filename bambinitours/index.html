<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Image Loop with Background Audio</title>
  <style>
    html, body { margin:0; height:100%; overflow:hidden; background:#000; }
    img {
      position:absolute; inset:0;
      width:100%; height:100%; object-fit:cover;
      opacity:0; transition:opacity 0.5s ease-in-out;
    }
    img.active { opacity:1; }
    /* Start overlay */
    #gate {
      position:fixed; inset:0; display:flex; align-items:center; justify-content:center;
      background:rgba(0,0,0,0.8); color:#fff; font:16px/1.4 system-ui, sans-serif;
      gap:16px; flex-direction:column;
    }
    #gate button {
      font:16px/1 system-ui, sans-serif; padding:12px 18px; border:0; border-radius:999px;
      background:#fff; color:#000; cursor:pointer;
    }
    #gate.hidden { display:none; }
  </style>
</head>
<body>
  <!-- Background audio -->
  <audio id="bg" preload="auto" loop playsinline>
    <source src="satan_city.mp3" type="audio/mpeg">
    <!-- Add other formats if you have them:
    <source src="audio.ogg" type="audio/ogg"> -->
  </audio>

  <!-- Images -->
  <img src="2.png" class="active" alt="">
  <img src="4.png" alt="">
  <img src="6.png" alt="">

  <!-- Autoplay gate (shown only if autoplay is blocked) -->
  <div id="gate">
    <button id="start">Tap to start</button>
  </div>

  <script>
    const imgs = Array.from(document.querySelectorAll('img'));
    const audio = document.getElementById('bg');
    const gate = document.getElementById('gate');
    const startBtn = document.getElementById('start');

    // Slideshow
    let idx = 0;
    setInterval(() => {
      imgs[idx].classList.remove('active');
      idx = (idx + 1) % imgs.length;
      imgs[idx].classList.add('active');
    }, 1000);

    // Try autoplay; if blocked, show the gate
    (async () => {
      try {
        // Some browsers require load() before play() when created paused
        audio.load();
        await audio.play();                 // may reject due to autoplay policy
        gate.classList.add('hidden');       // success: hide gate
      } catch (e) {
        // Autoplay blocked: wait for user gesture
        gate.classList.remove('hidden');
      }
    })();

    // User gesture kicks off audio
    startBtn.addEventListener('click', async () => {
      try {
        await audio.play();
        gate.classList.add('hidden');
      } catch (e) {
        alert('Could not start audio: ' + e);
      }
    });

    // If tab becomes active again and audio got paused, try to resume
    document.addEventListener('visibilitychange', () => {
      if (!document.hidden && gate.classList.contains('hidden')) {
        audio.play().catch(() => {}); // ignore if blocked
      }
    });
  </script>
</body>
</html>
